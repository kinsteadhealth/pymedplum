[tox]
envlist = py310, py311, py312, static, nogil
isolated_build = true

[testenv]
deps =
    pytest>=8.0.0
    pytest-cov>=5.0.0
    pytest-asyncio>=0.23.0
    coverage>=7.0.0
    respx>=0.21.0
    responses>=0.25.0
    python-dotenv>=1.0.0
commands =
    pytest {posargs:pymedplum/tests/unit/}

[testenv:static]
deps =
    # Pinned to the uv.lock version: a floating `>=` let CI silently pick
    # up a newer ruff whose freshly stabilized rules failed PRs that were
    # clean locally. Bump this together with the lockfile.
    ruff==0.15.6
    mypy>=1.11.0
commands =
    ruff check .
    ruff format --check .
    mypy pymedplum/

[testenv:lint]
deps =
    ruff>=0.8.0
commands =
    ruff check --fix .
    ruff format .

[testenv:integration]
deps =
    pytest>=8.0.0
    pytest-cov>=5.0.0
    pytest-asyncio>=0.23.0
    python-dotenv>=1.0.0
passenv =
    MEDPLUM_PROJECT_ID
    MEDPLUM_CLIENT_ID
    MEDPLUM_CLIENT_SECRET
commands =
    pytest {posargs:pymedplum/tests/integration/}
